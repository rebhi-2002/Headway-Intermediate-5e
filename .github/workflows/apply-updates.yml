# يفك أي zip يُرفع في مجلد updates/ فوق جذر الموقع، يحذفه، ويرفع النتيجة (فينشر pages.yml تلقائياً).
name: Apply update zips
on:
  push:
    branches: [main]
    paths: ['updates/*.zip']
  workflow_dispatch:
permissions: { contents: write }
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip in order
        run: |
          shopt -s nullglob
          for z in $(ls updates/*.zip | sort -V); do
            echo "applying $z"; unzip -o -q "$z" -x 'updates/*'; git rm -q -f "$z"
          done
          [ -f tools/make_sw.py ] && python3 tools/make_sw.py || true
      - name: Commit
        run: |
          git config user.name "update-bot"; git config user.email "bot@users.noreply.github.com"
          git add -A; git diff --cached --quiet || git commit -m "Apply update zips"; git push
